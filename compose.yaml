
services:
  caddy:
    build:
      context: .
    image: local/naive-forwardproxy-caddy:dev
    container_name: naive-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /data:size=16m,noexec,nosuid,nodev
      - /config:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /usr/bin/caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
