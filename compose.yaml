services:
  caddy:
    build:
      context: .
    image: local/naive-forwardproxy-caddy:dev
    container_name: naive-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      # Mount the full tree so /live symlinks into /archive remain valid.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /data:size=16m,noexec,nosuid,nodev
      - /config:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
